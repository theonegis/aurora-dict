name: Build offline AI installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-universal:
    name: macOS Universal offline AI
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: bash scripts/prepare-llama-sidecar.sh universal-apple-darwin
      - run: npm run tauri build -- --config src-tauri/tauri.offline.conf.json --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-dict-offline-ai-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  windows-x64:
    name: Windows x64 offline AI
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: bash scripts/prepare-llama-sidecar.sh x86_64-pc-windows-msvc
      - run: npm run tauri build -- --config src-tauri/tauri.offline.conf.json --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-dict-offline-ai-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe

  linux-deb:
    name: Linux x64 deb offline AI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: bash scripts/prepare-llama-sidecar.sh x86_64-unknown-linux-gnu
      - run: npm run tauri build -- --config src-tauri/tauri.offline.conf.json --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-dict-offline-ai-linux-x64-deb
          path: src-tauri/target/release/bundle/deb/*.deb
