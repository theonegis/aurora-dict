name: Build offline AI installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.name }} offline AI
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ARM64
            target: aarch64-apple-darwin
            artifact_arch: arm64
          - name: x64
            target: x86_64-apple-darwin
            artifact_arch: x64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: bash scripts/prepare-llama-sidecar.sh ${{ matrix.target }}
      - run: npm run tauri build -- --config src-tauri/tauri.offline.conf.json --target ${{ matrix.target }} --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-dict-offline-ai-macos-${{ matrix.artifact_arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  windows-x64:
    name: Windows x64 offline AI
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: bash scripts/prepare-llama-sidecar.sh x86_64-pc-windows-msvc
      - run: npm run tauri build -- --config src-tauri/tauri.offline.conf.json --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-dict-offline-ai-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe

  linux:
    name: Linux x64 deb and rpm offline AI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: bash scripts/prepare-llama-sidecar.sh x86_64-unknown-linux-gnu
      - run: npm run tauri build -- --config src-tauri/tauri.offline.conf.json --bundles deb,rpm
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-dict-offline-ai-linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
